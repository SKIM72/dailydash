name: Deploy DailyDash to GitHub Pages

# 화면(HTML/JS)은 GitHub Pages 에서, 데이터는 집 서버 API 에서 받아온다.
# 필요한 설정: GitHub 저장소 → Settings → Secrets and variables → Actions → Variables
#   API_BASE_URL = 집 서버 API 주소 (예: https://175.201.61.141)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - name: Check API address
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::저장소 Variables 에 API_BASE_URL(집 서버 API 주소)을 먼저 등록하세요."
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::API_BASE_URL 은 https:// 로 시작해야 합니다. (GitHub Pages 는 https 라서 http API 는 브라우저가 차단)"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
